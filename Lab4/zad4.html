<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.x3dom.org/download/dev/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/dev/x3dom.css">
  <style>
    x3d { width: 800px; height: 600px; }
  </style>
</head>
<body>
  <x3d>
    <scene id="scene">  
    </scene>
  </x3d>
</body>

<script>
    const scene = document.getElementById('scene');

    for(let i = 0; i < 3; i++){
        const newSphereHTML = `
            <transform id="trans${i}" translation='0 ${i*1.5} 0'> 
                <shape> 
                <appearance> 
                <material id="mat${i}" diffuseColor='0.2 0.2 0.2'></material> 
                </appearance> 
                <sphere></sphere> 
                </shape> 
            </transform> 
        `

        scene.insertAdjacentHTML('beforeend', newSphereHTML);
    }

    let frame = 3;
    const colors = [`0 1 0`, `1 1 0`, `1 0 0`];
    const color_null = `0.2 0.2 0.2`;

    async function loop() {
        const now = `mat${frame%3}`;
        const prev = `mat${(frame-1)%3}`;
        const mat = document.getElementById(now);
        const mat_prev = document.getElementById(prev);

        mat.setAttribute('diffuseColor', colors[frame%3]);
        mat_prev.setAttribute('diffuseColor', color_null);

        await new Promise(r => setTimeout(r, 2000));
        frame++;
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

</script>

</html>
