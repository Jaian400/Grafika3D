<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.x3dom.org/download/dev/x3dom.js"></script>
  <link rel="stylesheet" href="https://www.x3dom.org/download/dev/x3dom.css">
  <style>
    x3d { width: 1200px; height: 800px; }
  </style>
</head>
<body>
    <div class="controls">
    <label for="colorSlider">Kolor ciała (odcień):</label>
    <input type="range" id="colorSlider" min="0" max="360" value="30">
  </div>

  <x3d>
    <scene id="scene">  
        <transform translation="0 0 0">
            <shape> 
                <appearance>
                <ImageTexture url='steve.jpg'></ImageTexture>
                </appearance>
                <box size="2 2 2"></box> 
            </shape>
        </transform>

        <transform translation="0 -2.5 0">
            <shape> 
                <appearance> 
                <material class="body-part" diffuseColor='0.8 0.4 0'></material> 
                </appearance> 
                <box size="3 3 1"></box> 
            </shape>
        </transform>
        
    </scene>
  </x3d>
</body>

<script>
    const scene = document.getElementById('scene');

    for(let i = 0; i < 2; i++){
        const newSphereHTML = `
            <transform translation="${i*-4 + 2} -2.5 0">
                <shape> 
                    <appearance> 
                    <material diffuseColor='0.8 0.4 0'></material> 
                    </appearance> 
                    <box size="0.8 2.5 0.8"></box> 
                </shape>
            </transform>
        `
        scene.insertAdjacentHTML('beforeend', newSphereHTML);
    }

    for(let i = 0; i < 2; i++){
        const newSphereHTML = `
            <transform translation="${i*-1.4 + 0.7} -5.5 0">
                <shape> 
                    <appearance> 
                    <material diffuseColor='0.8 0.4 0'></material> 
                    </appearance> 
                    <box size="1 2.7 1"></box> 
                </shape>
            </transform>
        `
        scene.insertAdjacentHTML('beforeend', newSphereHTML);
    }

    function hslToRgb(h, s, l) {
        let c = (1 - Math.abs(2 * l - 1)) * s;
        let x = c * (1 - Math.abs((h / 60) % 2 - 1));
        let m = l - c / 2;
        let r = 0, g = 0, b = 0;

        if (0 <= h && h < 60) { r = c; g = x; b = 0; }
        else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
        else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
        else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
        else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
        else if (300 <= h && h <= 360) { r = c; g = 0; b = x; }

        return `${(r + m).toFixed(2)} ${(g + m).toFixed(2)} ${(b + m).toFixed(2)}`;
    }

    const slider = document.getElementById('colorSlider');
    const bodyMaterials = document.querySelectorAll('.body-part');

    slider.addEventListener('input', (e) => {
        const hue = parseFloat(e.target.value);
        const newColor = hslToRgb(hue, 0.85, 0.45);

        bodyMaterials.forEach(mat => {
            mat.setAttribute('diffuseColor', newColor);
        });
    });

</script>

</html>
